# docker-compose.yml
services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: sba_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - sba_network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: sba_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sba_network
    depends_on:
      - app

  db:
    image: postgres:15
    container_name: sba_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sba_db}
      POSTGRES_USER: ${DB_USERNAME:-sba_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - sba_db_data:/var/lib/postgresql/data
    networks:
      - sba_network

  redis:
    image: redis:alpine
    container_name: sba_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sba_redis_data:/data
    networks:
      - sba_network

  ml_service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sba_ml_service
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./ml-service:/app
    networks:
      - sba_network

networks:
  sba_network:
    driver: bridge

volumes:
  sba_db_data:
  sba_redis_data:
